# Выпуск релиза: поднять versionCode/versionName в app/build.gradle.kts,
# закоммитить и отправить тег:  git tag v1.6 && git push origin v1.6
# GitHub соберёт, подпишет и опубликует Budila.apk.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # пробный запуск: сборка и подпись без публикации

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Тег совпадает с versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "v$VER" = "$GITHUB_REF_NAME" ] || { echo "::error::Тег $GITHUB_REF_NAME, а versionName = $VER"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Тесты и сборка
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Проверка подписи
        run: |
          cp app/build/outputs/apk/release/app-release.apk Budila.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs Budila.apk | grep -oP 'SHA-256 digest: \K\w+')
          [ -n "$SHA" ] || { echo "::error::APK не подписан"; exit 1; }
          [ "$SHA" = "f05702b58945b9ac603544d18557aa0a427b6d1fd4e852620e994558562db189" ] || { echo "::error::APK подписан чужим ключом: $SHA"; exit 1; }
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Пробный запуск — APK во вложения
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Budila-apk
          path: Budila.apk

      - name: Публикация
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(printf '**Установка:** скачайте Budila.apk, откройте и разрешите установку. Android 8.0+.\n\nПодпись (SHA-256): `%s`' "$SHA")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Budila.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Budila.apk --title "Budila $VER" --generate-notes --latest --notes "$NOTES"
          fi

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
